name: Pre-render index.html

# Runs whenever the static data files that feed the pre-rendered sections
# are changed on main. Injects the rendered HTML so Bingbot and other
# JS-limited crawlers can read the content without executing JavaScript.

on:
  push:
    branches: [main]
    paths:
      - 'data/site.json'
      - 'data/featured-media.json'
      - 'data/publications.json'
      - 'data/speaking.json'
      - 'data/as-seen-in.json'
      - 'data/videos.json'
      - 'data/library.json'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  prerender:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the commit step may need to rebase onto origin/main,
          # and rebasing inside the default shallow clone is unreliable.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Pre-render index.html
        run: npm run prerender

      - name: Commit pre-rendered HTML
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html sitemap.xml
            git commit -m "chore: pre-render index.html [skip ci]"
            # Same non-fast-forward race as fetch-news.yml: a push landing on
            # main mid-run would otherwise fail the job outright.
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              echo "push rejected (attempt $attempt) — rebasing onto origin/main"
              git pull --rebase origin main || exit 1
              sleep 5
            done
            echo "::error::push still failing after 3 attempts"
            exit 1
          else
            echo "No changes to commit."
          fi
